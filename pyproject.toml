[tool.poetry]
name = "ff14-fish-telegram"
version = "0.1.0"
description = "Telegram bot for tracking FFXIV fish availability"
packages = [{ include = "ff14_fish_telegram", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12"
python-telegram-bot = ">=20,<20.8"
eorzeaenv = ">=2.2,<3"
aiohttp = ">=3,<4"
apscheduler = ">=3,<4"
python-dotenv = ">=1,<2"
demjson3 = ">=3,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
pytest-mock = ">=3.15.1,<4"
ruff = ">=0.15.20,<0.16"

[tool.poetry.scripts]
ff14-fish-telegram = "ff14_fish_telegram.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
